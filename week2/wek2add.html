<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>
    <h1>Simple Calculator</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <br><br>

    <button onclick="calculate('add')">Add (+)</button>
    <button onclick="calculate('subtract')">Subtract (-)</button>
    <button onclick="calculate('multiply')">Multiply (×)</button>
    <button onclick="calculate('divide')">Divide (÷)</button>

    <p id="result"></p>

    <script>
        function calculate(operation) {
            let num1 = parseFloat(document.getElementById("num1").value);
            let num2 = parseFloat(document.getElementById("num2").value);

            if (isNaN(num1) || isNaN(num2)) {
                document.getElementById("result").innerText = "Please enter valid numbers!";
                return;
            }

            let result;

            if (operation === 'add') {
                result = num1 + num2;
                document.getElementById("result").innerText = `Sum of ${num1} and ${num2} is ${result}`;
            } 
            else if (operation === 'subtract') {
                result = num1 - num2;
                document.getElementById("result").innerText = `Difference of ${num1} and ${num2} is ${result}`;
            } 
            else if (operation === 'multiply') {
                result = num1 * num2;
                document.getElementById("result").innerText = `Product of ${num1} and ${num2} is ${result}`;
            } 
            else if (operation === 'divide') {
                if (num2 === 0) {
                    document.getElementById("result").innerText = "Cannot divide by zero!";
                } else {
                    result = num1 / num2;
                    document.getElementById("result").innerText = `Quotient of ${num1} and ${num2} is ${result}`;
                }
            }
        }
    </script>
</body>
</html>
